# Production (EC2): serves the built frontend and proxies /api to the Node backend on :5000 => same origin, no CORS
server {
  listen 80;
  root /var/www/vehicle-store;   # contents of frontend/dist
  index index.html;
  location /api/ { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location / { try_files $uri /index.html; }
}
